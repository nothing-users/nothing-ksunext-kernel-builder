name: Build Asteroids GKI with KernelSU Next

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel fork branch, tag, or commit
        required: true
        default: sm7635/b/mr_Frogger
        type: string
      ksun_ref:
        description: KernelSU Next branch, tag, or commit
        required: true
        default: dev
        type: string
      create_release:
        description: Publish the resulting files as a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: asteroids-gki-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_REPOSITORY: https://github.com/nothing-users/android_kernel_msm-6.1_nothing_sm7635.git
  KSU_REPOSITORY: https://github.com/KernelSU-Next/KernelSU-Next.git
  ANDROID_MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  ANDROID_MANIFEST_BRANCH: common-android14-6.1-2023-06
  KLEAF_TARGET: //common:kernel_aarch64
  KMI_SYMBOL_LIST: //msm-kernel:android/abi_gki_aarch64_qcom
  STOCK_BOOT_ARCHIVE_URL: https://github.com/spike0en/nothing_archive/releases/download/Asteroids_B4.1-260618-1048/Asteroids_B4.1-260618-1048-image-boot.7z
  STOCK_BOOT_ARCHIVE_SHA256: c5aa47b2ef03efc33a8c765b3a3a74f62203d594d43a59816a1538b65117ffe4
  STOCK_BOOT_HASH_MANIFEST_URL: https://github.com/spike0en/nothing_archive/releases/download/Asteroids_B4.1-260618-1048/Asteroids_B4.1-260618-1048-hash.sha256
  STOCK_RELEASE: Asteroids_B4.1-260618-1048

jobs:
  build:
    name: Asteroids GKI + KernelSU Next
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl file flex git jq libelf-dev libssl-dev p7zip-full python3 rsync unzip zip

      - name: Clone patched kernel fork
        id: kernel
        shell: bash
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -Eeuo pipefail
          kernel_dir="$RUNNER_TEMP/kernel-source"
          git init "$kernel_dir"
          git -C "$kernel_dir" remote add origin "$KERNEL_REPOSITORY"
          git -C "$kernel_dir" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$KERNEL_REF"
          git -C "$kernel_dir" checkout --detach FETCH_HEAD

          kernel_commit="$(git -C "$kernel_dir" rev-parse HEAD)"
          printf 'dir=%s\n' "$kernel_dir" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$kernel_commit" >> "$GITHUB_OUTPUT"
          printf 'Kernel commit: %s\n' "$kernel_commit"

      - name: Integrate KernelSU Next
        id: kernelsu
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.kernel.outputs.dir }}
          KSU_REF: ${{ inputs.ksun_ref }}
        run: |
          set -Eeuo pipefail
          ksu_dir="$RUNNER_TEMP/KernelSU-Next"
          scripts/integrate-kernelsu-next.sh \
            "$KERNEL_DIR" \
            "$ksu_dir" \
            "$KSU_REPOSITORY" \
            "$KSU_REF"

          ksu_commit="$(git -C "$ksu_dir" rev-parse HEAD)"
          ksu_tag="$(git -C "$ksu_dir" describe --tags --abbrev=0 HEAD 2>/dev/null || printf unknown)"
          ksu_version_code="$((30000 + $(git -C "$ksu_dir" rev-list --count HEAD)))"
          printf 'commit=%s\n' "$ksu_commit" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$ksu_tag" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$ksu_version_code" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Android Kleaf workspace
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.kernel.outputs.dir }}
        run: |
          scripts/bootstrap-kleaf.sh \
            "$RUNNER_TEMP/asteroids-kleaf" \
            "$KERNEL_DIR" \
            "$ANDROID_MANIFEST_URL" \
            "$ANDROID_MANIFEST_BRANCH"

      - name: Build the Asteroids GKI
        shell: bash
        run: |
          mkdir -p artifacts
          scripts/build-asteroids.sh \
            "$RUNNER_TEMP/asteroids-kleaf" \
            "$GITHUB_WORKSPACE/artifacts" \
            "$KLEAF_TARGET" \
            "$KMI_SYMBOL_LIST"

      - name: Download and verify stock Asteroids boot image
        id: stock_boot
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/$STOCK_RELEASE-image-boot.7z"
          hash_manifest="$RUNNER_TEMP/$STOCK_RELEASE-hash.sha256"
          extract_dir="$RUNNER_TEMP/$STOCK_RELEASE-boot"

          curl --fail --location --retry 3 --output "$hash_manifest" "$STOCK_BOOT_HASH_MANIFEST_URL"
          curl --fail --location --retry 3 --output "$archive" "$STOCK_BOOT_ARCHIVE_URL"
          printf '%s  %s\n' "$STOCK_BOOT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict

          mapfile -t stock_boot_hashes < <(awk '$2 == "*./boot.img" { print $1 }' "$hash_manifest")
          if (( ${#stock_boot_hashes[@]} != 1 )); then
            printf 'Expected exactly one ./boot.img entry in %s, found %s\n' \
              "$hash_manifest" "${#stock_boot_hashes[@]}" >&2
            exit 1
          fi
          stock_boot_sha256="${stock_boot_hashes[0],,}"
          [[ "$stock_boot_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            printf 'Invalid boot.img SHA-256 in %s: %s\n' "$hash_manifest" "$stock_boot_sha256" >&2
            exit 1
          }

          mkdir -p "$extract_dir"
          7z e -y "-o$extract_dir" "$archive" boot.img
          install -m 0644 "$extract_dir/boot.img" "$RUNNER_TEMP/stock-boot.img"
          printf '%s  %s\n' "$stock_boot_sha256" "$RUNNER_TEMP/stock-boot.img" | sha256sum --check --strict
          printf 'sha256=%s\n' "$stock_boot_sha256" >> "$GITHUB_OUTPUT"

      - name: Repack verified Asteroids boot image
        shell: bash
        run: |
          scripts/repack-boot.sh \
            "$RUNNER_TEMP/stock-boot.img" \
            "$GITHUB_WORKSPACE/artifacts/Image.gz" \
            "$RUNNER_TEMP/asteroids-kleaf/tools/mkbootimg" \
            "$GITHUB_WORKSPACE/artifacts/boot.img"

      - name: Write build metadata
        id: metadata
        shell: bash
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
          KERNEL_COMMIT: ${{ steps.kernel.outputs.commit }}
          KSU_REF: ${{ inputs.ksun_ref }}
          KSU_COMMIT: ${{ steps.kernelsu.outputs.commit }}
          KSU_TAG: ${{ steps.kernelsu.outputs.tag }}
          KSU_VERSION_CODE: ${{ steps.kernelsu.outputs.version_code }}
          STOCK_BOOT_SHA256: ${{ steps.stock_boot.outputs.sha256 }}
        run: |
          set -Eeuo pipefail

          image_sha256="$(sha256sum artifacts/Image | awk '{print $1}')"
          image_gz_sha256="$(sha256sum artifacts/Image.gz | awk '{print $1}')"
          kernel_version="$(<artifacts/kernel-version.txt)"
          base_boot_sha256="$STOCK_BOOT_SHA256"
          boot_sha256="$(sha256sum artifacts/boot.img | awk '{print $1}')"

          jq -n \
            --arg device asteroids \
            --arg target "$KLEAF_TARGET" \
            --arg kmi_symbol_list "$KMI_SYMBOL_LIST" \
            --arg kernel_repository "$KERNEL_REPOSITORY" \
            --arg kernel_ref "$KERNEL_REF" \
            --arg kernel_commit "$KERNEL_COMMIT" \
            --arg kernel_version "$kernel_version" \
            --arg ksu_repository "$KSU_REPOSITORY" \
            --arg ksu_ref "$KSU_REF" \
            --arg ksu_commit "$KSU_COMMIT" \
            --arg ksu_tag "$KSU_TAG" \
            --arg ksu_version_code "$KSU_VERSION_CODE" \
            --arg image_sha256 "$image_sha256" \
            --arg image_gz_sha256 "$image_gz_sha256" \
            --arg stock_release "$STOCK_RELEASE" \
            --arg stock_archive_url "$STOCK_BOOT_ARCHIVE_URL" \
            --arg stock_archive_sha256 "$STOCK_BOOT_ARCHIVE_SHA256" \
            --arg stock_hash_manifest_url "$STOCK_BOOT_HASH_MANIFEST_URL" \
            --arg base_boot_sha256 "$base_boot_sha256" \
            --arg boot_sha256 "$boot_sha256" \
            '{
              device: $device,
              build_system: "Kleaf/Bazel",
              target: $target,
              kmi_symbol_list: $kmi_symbol_list,
              kernel: {
                repository: $kernel_repository,
                ref: $kernel_ref,
                commit: $kernel_commit,
                version: $kernel_version
              },
              kernelsu_next: {
                repository: $ksu_repository,
                ref: $ksu_ref,
                commit: $ksu_commit,
                tag: $ksu_tag,
                version_code: ($ksu_version_code | tonumber)
              },
              config: {
                module_sig_protect: false,
                module_sig_all: true,
                trim_unused_ksyms: true,
                ksu: true,
                ksu_debug: false
              },
              image_sha256: $image_sha256,
              image_gz_sha256: $image_gz_sha256,
              stock_boot_source: {
                project: "spike0en/nothing_archive",
                release: $stock_release,
                archive_url: $stock_archive_url,
                archive_sha256: $stock_archive_sha256,
                hash_manifest_url: $stock_hash_manifest_url
              },
              base_boot_sha256: $base_boot_sha256,
              boot_sha256: $boot_sha256
            }' > artifacts/build.json

          {
            printf 'Nothing Phone (3a) series — Asteroids GKI\n\n'
            printf 'Kernel: %s\n' "$kernel_version"
            printf 'Kleaf target: %s\n' "$KLEAF_TARGET"
            printf 'Kernel commit: %s\n' "$KERNEL_COMMIT"
            printf 'KernelSU Next: %s (%s, version code %s)\n' "$KSU_TAG" "$KSU_COMMIT" "$KSU_VERSION_CODE"
            printf 'Image SHA256: %s\n' "$image_sha256"
            printf 'Image.gz SHA256: %s\n' "$image_gz_sha256"
            printf 'Stock boot source: Nothing Archive %s\n' "$STOCK_RELEASE"
            printf 'Stock boot.img SHA256: %s\n' "$base_boot_sha256"
            printf 'Repacked boot.img SHA256: %s\n' "$boot_sha256"
            printf '\nboot.img was rebuilt from the downloaded, SHA-256-verified stock image.\n'
          } > artifacts/README.txt

          printf 'kernel_version=%s\n' "$kernel_version" >> "$GITHUB_OUTPUT"
          printf 'image_gz_sha256=%s\n' "$image_gz_sha256" >> "$GITHUB_OUTPUT"
          printf 'boot_sha256=%s\n' "$boot_sha256" >> "$GITHUB_OUTPUT"

          {
            echo '### Asteroids GKI build'
            echo ''
            echo '| Field | Value |'
            echo '|---|---|'
            echo "| Kernel | \`$kernel_version\` |"
            echo "| Commit | \`$KERNEL_COMMIT\` |"
            echo "| KernelSU Next | \`$KSU_TAG\` / \`$KSU_COMMIT\` |"
            echo "| KernelSU version code | \`$KSU_VERSION_CODE\` |"
            echo "| Image.gz SHA256 | \`$image_gz_sha256\` |"
            echo "| boot.img SHA256 | \`$boot_sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Asteroids build
        uses: actions/upload-artifact@v4
        with:
          name: asteroids-ksunext-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostics after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: asteroids-ksunext-failure-${{ github.run_number }}
          path: |
            artifacts/
            ${{ runner.temp }}/asteroids-kleaf/out/bazel/**/command.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ inputs.create_release && success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ steps.metadata.outputs.kernel_version }}
        run: |
          set -Eeuo pipefail
          tag="asteroids-ksunext-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create \
            "$tag" \
            artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Asteroids KernelSU Next $KERNEL_VERSION" \
            --notes "Built with Kleaf from $KERNEL_REPOSITORY at ${{ steps.kernel.outputs.commit }} with KernelSU Next ${{ steps.kernelsu.outputs.tag }} at ${{ steps.kernelsu.outputs.commit }}."
